[package]
name = "http-tunnel"
version = "0.1.12"
authors = ["Eugene Retunsky"]
license = "MIT OR Apache-2.0"
edition = "2021"
publish = true
readme = "README.md"
repository = "https://github.com/xnuter/http-tunnel"
homepage = "https://github.com/xnuter/http-tunnel"
description = """
HTTP Tunnel/TCP Proxy example written in Rust.
"""

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tokio-native-tls = "0.3"
native-tls = "0.2"
clap = { version = "4", features = ["derive"] }
regex = "1.3"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0"
serde_regex = "1.1"
humantime-serde = "1.0"
async-trait = "0.1"
derive_builder = "0.20"
log = "0.4"
log4rs = "1.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
bytes = "1"
futures = "0.3"

# QUIC transport (optional)
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[features]
# For legacy software you can enable plain_text tunnelling
default = []
plain_text = []
quic = ["quinn", "rustls", "rustls-pemfile"]
